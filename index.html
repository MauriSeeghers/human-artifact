<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mauricio's Human Artifact</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 40px;
            max-width: 600px;
            background-color: #161b22;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        h1 {
            color: #58a6ff;
            margin-bottom: 10px;
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.1em;
            background-color: #58a6ff;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        p {
            line-height: 1.6;
            font-size: 1.1em;
        }
        .status {
            color: #8b949e; 
            font-size: 0.9em;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>> Mauricio_Seeghers_Antelo</h1>
        <p>Welcome to my staging environment.</p>
        <p>This URL will serve as the live host for my final <strong>Human Artifact</strong> project for the FIU Honors College seminar.</p>
        <p class="status">[ System Status: Awaiting Project Deployment ]<span class="cursor"></span></p>
    </div>
</body>
</html>
